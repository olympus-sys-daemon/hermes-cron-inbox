name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # The plugin's own runtime deps are provided by Hermes (fastapi,
          # pydantic). Pin nothing here: this job proves the code works against
          # a current FastAPI, not against a version the plugin selected.
          pip install fastapi pytest httpx

      - name: Parser tests (synthetic + any corpus present)
        run: python tests/test_parse.py

      - name: Route tests
        run: python tests/test_routes.py

      - name: Same tests under pytest
        run: pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Byte-compile the backend
        run: python -m py_compile dashboard/plugin_api.py __init__.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check the desktop half
        # The app loads plugin.js uncompiled, so a syntax error is a load
        # failure. node --check is the cheapest gate that catches it.
        run: node --check desktop/plugin.js
      - name: Notifier behaviour
        # The notifier's failure modes are silent (backlog spam on launch, a
        # missed report when the count stays flat), so they need asserted
        # behaviour rather than a syntax check.
        run: node tests/test_notifier.mjs
      - name: Scheduled jobs button
        # Asserts the button exists, is labelled, and targets core's real /cron.
        # Self-skips when there is no Hermes app to read, as on this runner: the
        # assertions depend on core's source, not on the plugin alone.
        run: node tests/test_scheduled_button.mjs
      - name: Title outranks body
        # The card once had the report brighter and larger than the job name, so
        # the heading read as a caption over its own content.
        run: node tests/test_hierarchy.mjs
      - name: Click targets
        # Proves the body you see is the run a click opens. A watcher whose last
        # tick was silent used to open a blank reader - the bug this pins.
        run: |
          if [ -z "$(find "${HERMES_HOME:-$HOME/.hermes}"/cron/output -name '*.md' 2>/dev/null | head -1)" ] \
             && [ -z "$(find "${HERMES_HOME:-$HOME/.hermes}"/profiles/*/cron/output -name '*.md' 2>/dev/null | head -1)" ]; then
            echo "no cron corpus on this runner - skipping"
            exit 0
          fi
          node tests/test_click_targets.mjs
      - name: Dashboard renders with real data
        # Proves the cards render their body text: the whole redesign is that
        # reading needs no click, and a shallow render cannot see that. Skips
        # when the machine has no cron corpus to read.
        run: |
          if [ -z "$(find "${HERMES_HOME:-$HOME/.hermes}"/cron/output -name '*.md' 2>/dev/null | head -1)" ] \
             && [ -z "$(find "${HERMES_HOME:-$HOME/.hermes}"/profiles/*/cron/output -name '*.md' 2>/dev/null | head -1)" ]; then
            echo "no cron corpus on this runner - skipping the render test"
            exit 0
          fi
          node tests/test_render.mjs
